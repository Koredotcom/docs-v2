  /api/public/v1/workspaces/{workspaceId}/members/{memberId}/actions:
    post:
      summary: Apply a workspace member lifecycle action
      description: |-
        Runs a lifecycle action. Effects are limited to this workspace. At most 10 actions per member per hour.

        | action | Allowed from | Result |
        | --- | --- | --- |
        | `deactivate` | active, suspended, locked | `deactivated`; workspace sessions end |
        | `suspend` | active | `suspended`; workspace sessions end |
        | `reactivate` | suspended, deactivated, locked | `active`; a sign-in lockout returns `409 LOCKED_BY_LOGIN_LOCKOUT` |
        | `reset_mfa` | active, locked | MFA enrolment cleared |
        | `revoke_sessions` | active, suspended, locked | workspace sessions end; status unchanged |
        | `resend_invite` | pending, expired | new invitation, expiry restarted |

        Any other combination returns `409 INVALID_STATE_TRANSITION`.

        **Required scope:** `workspace.members.write`
      tags:
        - Workspace members
      security:
        - platformApiKey: []
        - bearerPlatformKey: []
      parameters:
        - schema:
            type: string
            minLength: 1
          required: true
          name: workspaceId
          in: path
        - schema:
            type: string
            minLength: 1
          required: true
          name: memberId
          in: path
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum:
                    - deactivate
                    - suspend
                    - reactivate
                    - reset_mfa
                    - revoke_sessions
                    - resend_invite
                reason:
                  type: string
                  maxLength: 500
              required:
                - action
              additionalProperties: false
            example:
              action: suspend
              reason: Leave of absence
        required: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      member:
                        $ref: "#/components/schemas/WorkspaceMember"
                      action:
                        type: string
                        enum:
                          - deactivate
