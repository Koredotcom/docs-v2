              anthropic,
              azure,
              bedrock,
              microsoft_foundry,
              google,
              gemini,
              vertex,
              vertex_ai,
              google_vertex,
              cohere,
              groq,
              mistral,
              fireworks,
              togetherai,
              together,
              perplexity,
              deepseek,
              xai,
              openrouter,
              litellm,
              openai_compatible,
              ultravox,
              custom,
              mock,
              unknown,
            ]
        environment:
          type: string
          description: |
            The environment the call ran in. Empty for design-time calls that have no
            conversation behind them, such as Arch, evaluation runs, pipelines, and
            Studio test calls.
          enum: ['', development, staging, production, working-copy]
        status:
          type: string
          enum: [success, failed]
          description: |
            Whether the call succeeded or failed.
        inputTokens:
          type: number
          minimum: 0
          description: |
            Tokens in the prompt sent to the model.
        cachedTokens:
          type: number
          minimum: 0
          description: |
            Input tokens served from the provider's prompt cache. These are part of inputTokens
