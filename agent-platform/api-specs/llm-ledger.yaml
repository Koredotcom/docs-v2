openapi: 3.1.0
info:
  title: ABL Public Analytics LLM Ledger API
  version: 1.0.0
  summary: Retrieve a project-scoped ledger of individual LLM calls.
  description: |
    Returns one row for every individual LLM call made in a project, with its model,
    provider, token counts, latency, and cost. Calls are listed individually — nothing
    is rolled up per conversation turn.

    Use `dataMode` to control detail. `summary` returns the facts about each call.
    `full` adds the exact prompt sent and response received under each call's `payload`,
    so you do not need a second request to retrieve them.

    Authenticate with the `x-api-key` header. The key must be bound to the project you
    are querying and have `analytics:read` permission.

    ## Sending parameters in a POST body

    Every GET on this API has a POST form on the same path. Send the same parameters
    as a flat JSON object instead of a query string. Use POST when the parameters
    themselves must be encrypted: a GET query string is never encrypted. GET stays
    available and unchanged.

    - Body keys are exactly the GET query parameter names. Numbers and booleans are
      converted to the strings the GET parser expects. List parameters accept a
      JSON array or a comma-separated string.
    - An unknown key, a `null`, or a nested value is rejected with
      `400 INVALID_QUERY_PARAMETER`. A body that is not a JSON object is rejected
      with `400 INVALID_REQUEST_BODY`.
    - Do not add a query string to a POST (`400 INVALID_QUERY_PARAMETER`), and do
      not split parameters between the query string and the body.
    - `Content-Type` must be `application/json` or `application/jose+json`,
      otherwise `415 UNSUPPORTED_MEDIA_TYPE`.
    - Permissions, validation, pagination and the response shape are identical to
      the GET form.

    ## Payload encryption

    Payload encryption is an opt-in setting on a Platform Key, configured in Studio
    under Settings → API Keys → Platform Keys. It has two independent toggles.
    Neither changes what the key may access, and both are available only to keys
    bound to exactly one project.

    **Request encryption** applies to POST bodies (a GET has no body). The body must
    be a JWE (RFC 7516) in flattened JSON serialization, `{protected, iv,
    ciphertext, tag}`, whose protected header is `{"alg":"dir","enc":"A256GCM"}`,
    optionally with `kid`, `typ` and `cty`. The key is the 32-byte AES-256 request
    key Studio shows when request encryption is enabled. `kid` is optional; if sent
    it must equal the key's Key ID shown in Studio.

    **Response encryption** applies to every response sent after the key is
    authenticated, successes and errors alike (400, 403, 404, 413, 415, 429, 500,
    503). The body is a flattened JWE `{protected, encrypted_key, iv, ciphertext,
    tag}` with protected header
    `{"alg":"RSA-OAEP-256","enc":"A256GCM","kid":"<Key ID>","pkf":"<fingerprint>"}`,
    sealed with a fresh AES-256 key per response that is wrapped with the RSA public
    key (≥ 2048 bits) configured on the Platform Key. `pkf` is the SHA-256 hex
    digest of that public key's SubjectPublicKeyInfo DER. The response keeps
    `Content-Type: application/json` and adds `X-ABL-Encrypted: true`. Decrypting
    it yields exactly the JSON documented in this spec. A `401` is never encrypted
    (the key is not known yet), and a `304` has no body.

    | Key setting | Plain JSON body | JWE body |
    |---|---|---|
    | Request encryption off | accepted | `400 ENCRYPTED_PAYLOAD_INVALID` |
    | Request encryption on | `400 ENCRYPTED_PAYLOAD_INVALID` | decrypted, then handled as plain JSON |

    Encryption fails closed: a configured key never receives plaintext by accident.

    - `400 ENCRYPTED_PAYLOAD_INVALID` is returned for every envelope problem: any
      other `alg`/`enc`, `zip` or `crit`, unknown header parameters, `unprotected`,
      `header`, `aad` or `recipients` members, a `kid` that is not this key's,
      padded or standard base64, a wrong IV (12 bytes) or tag (16 bytes) length, a
      failed authentication tag, or a plaintext that is not JSON.
    - `503 ENCRYPTION_CONFIG_UNAVAILABLE` (with `Retry-After: 30`) means the key's
      encryption configuration could not be read. Retry later; there is no
      plaintext fallback.
    - `500 INTERNAL_ERROR` with a content-free body is returned if a response cannot
      be encrypted.

    All JWE members are unpadded base64url. The AAD is the ASCII of the `protected`
    member, as in standard JWE, so JOSE libraries (for example `jose` for Node.js)
    can produce and open these envelopes directly. Pin the algorithms when
    decrypting: key management `RSA-OAEP-256`, content encryption `A256GCM`.
  x-source-release: develop
  x-source-commit: b6a1a328b3e089e03ca2494a7091d72a6a481d4b
  x-payload-encryption:
    jira: ABLP-5317
    source: develop, PR #4293 (POST twins + encryption) and PR #4314 (JWE envelope)
    source-commit: 6de86f59eb
    runtime-capability: 'GET /health -> capabilities.payloadEncryption: 2'
servers:
  - url: https://{host}
    variables: { host: { default: runtime.example.com } }
security: [{ ApiKeyAuth: [] }]
tags: [{ name: LLM Ledger }]
paths:
  /api/public/analytics/projects/{projectId}/llm-ledger:
    get:
      tags: [LLM Ledger]
      operationId: listPublicLlmLedger
      summary: List LLM calls
      description: |
        `fromDate` and `toDate` are required. `fromDate` is included in the results and
        `toDate` is not, so a full day is
        `fromDate=2026-08-04T00:00:00Z&toDate=2026-08-05T00:00:00Z`.

        All other filters are optional and match exactly. Filters combine with AND, so
        adding more narrows the results.

        `source` and `sourceSubtype` also accept older spellings and translate them for
        you — see those parameters for the details.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: fromDate
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: toDate
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          description: |
            How many calls to return. When `dataMode=full`, a page may come back with
            fewer rows than requested so the response stays within the 1 MiB size limit
            — check `hasMore` rather than assuming a short page is the last one.
          schema: { type: integer, minimum: 1, maximum: 10000, default: 100 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: sessionIds
          in: query
          description: |
            Filter to specific sessions. Pass up to 10,000 session IDs, comma-separated
            or by repeating the parameter.
          style: form
          explode: false
          schema:
            {
              type: array,
              maxItems: 10000,
              uniqueItems: true,
              items: { type: string, minLength: 1 },
            }
        - name: channel
          in: query
          description: |
            Filter by the channel the conversation took place on. Design-time calls,
            such as Studio test calls, are not tied to a channel and will not match any
            channel filter.

            Matched exactly as stored, with no alias handling. Unlike the sessions
            endpoint, shorthand such as `web` or `sms` is not expanded here — use the
            exact channel name such as `web_chat` or `twilio_sms`.

            Not restricted to a fixed list, so an unrecognised value returns no results
            rather than an error. Cannot be empty (`400 INVALID_FILTER`).
          schema:
            type: string
            enum:
              [
                http_async,
                slack,
                line,
                msteams,
                whatsapp,
                messenger,
                instagram,
                twilio_sms,
                zendesk,
                telegram,
                genesys,
                genesys_open_messaging,
                ai4w,
                kore_agent_assist,
                email,
                voice_vxml,
                korevg,
                audiocodes,
                genesys_audio_connector,
                voice_pipeline,
                voice_realtime,
                voice,
                voice_twilio,
                voice_livekit,
                ag_ui,
                a2a,
                sdk_websocket,
                web_debug,
                web_chat,
                api,
                http,
              ]
        - name: source
          in: query
          description: |
            Filter by which part of the platform made the call — for example `runtime`
            for live agent traffic, or `evals` for evaluation runs.

            You can pass either the current name or an older one; the older spellings
            listed under `x-alias-groups` are translated for you, and matching is
            case-insensitive with `-` and spaces treated as `_`. So `agent_session`
            finds the same calls as `runtime`.

            Not restricted to a fixed list, so an unrecognised value returns no results
            rather than an error. Cannot be empty (`400 INVALID_FILTER`).
          schema:
            {
              type: string,
              enum:
                [
                  runtime,
                  runtime_internal,
                  arch,
                  evals,
                  pipelines,
                  guardrails,
                  knowledge,
                  studio_test_calls,
                  channels,
                  agent_session,
                  eval,
                  analytics_pipeline,
                  analytics_query,
                  guardrail,
                  search_ai,
                  prompt_library,
                  model_health,
                  model_admin,
                  'health:credential-store',
                  sdk_widget_localization,
                ],
            }
          x-alias-groups:
            runtime: [runtime, agent_session]
            runtime_internal: [runtime_internal]
            arch: [arch]
            evals: [evals, eval]
            pipelines: [pipelines, analytics_pipeline]
            guardrails: [guardrails, guardrail]
            knowledge: [knowledge, search_ai, analytics_query]
            studio_test_calls:
              [
                studio_test_calls,
                prompt_library,
                model_health,
                model_admin,
                'health:credential-store',
              ]
            channels: [channels, sdk_widget_localization]
        - name: sourceSubtype
          in: query
          description: |
            Filter by the specific purpose of the call within its source — for example
            `response_generation` for replies to users, or `guardrails` for safety
            checks.

            Older spellings are translated for you, as listed under `x-alias-groups`. If
            you also pass `source`, translation is limited to that source's subtypes; on
            its own, subtype names are resolved across all sources.

            Not restricted to a fixed list, so an unrecognised value returns no results
            rather than an error. Cannot be empty (`400 INVALID_FILTER`).
          schema:
            {
              type: string,
              enum:
                [
                  response_generation,
                  conversation_history_compaction,
                  ner_gather_llm_extraction,
                  model_based_pii_entity_recognizer,
                  model_entity_preview,
                  llm_backed_validation,
                  searchai_kb_query_intelligence,
                  searchai_query_assistance,
                  routing_pipeline,
                  pipeline_classifier,
                  pipeline_tool_filter,
                  pipeline_merge,
                  contextual_filler_generation,
                  tool_result_summarization,
                  sip_handoff_summary,
                  semantic_execution,
                  legacy_nlu_fallback,
                  general_assistance,
                  project_assistance,
                  eval_remediation,
                  evaluation_suite_generation,
                  natural_language_analytics_query,
                  text_to_sql,
                  guardrails,
                  studio_test_calls,
                  widget_copy_translation,
                  tool_use_iteration,
                  response_gen,
                  realtime_response,
                  conversation_compaction,
                  nlu_entity_extraction,
                  kb_classify_rewrite,
                  field_validation,
                  agent_building,
                  eval_suite_creation,
                  eval_design_time_asset_generation,
                  nl_to_sql,
                  nl_query,
                  query_intelligence,
                  prompt_test,
                  prompt_experiment,
                  credential_health_check,
                  translation_generation,
                ],
            }
          x-alias-groups:
            response_generation: [tool_use_iteration, response_gen, realtime_response]
            conversation_history_compaction: [conversation_compaction]
            ner_gather_llm_extraction: [nlu_entity_extraction]
            searchai_kb_query_intelligence: [kb_classify_rewrite]
            llm_backed_validation: [field_validation]
            general_assistance: [agent_building]
            evaluation_suite_generation: [eval_suite_creation, eval_design_time_asset_generation]
            natural_language_analytics_query: [nl_to_sql, nl_query]
            text_to_sql: [nl_to_sql]
            searchai_query_assistance: [query_intelligence]
            studio_test_calls: [prompt_test, prompt_experiment, credential_health_check]
            widget_copy_translation: [translation_generation]
        - name: status
          in: query
          description: |
            Filter to successful or failed calls. Any other value is rejected with `400
            INVALID_STATUS`.
          schema: { type: string, enum: [success, failed] }
        - name: model
          in: query
          description: |
            Filter by model, using the exact model id as recorded, such as `gpt-4o`.
            There is no fixed list, because each tenant can register its own models.
            Calls recorded without a model id appear as `unknown` and can be found with
            `model=unknown`. Cannot be empty (`400 INVALID_FILTER`).
          schema: { type: string, minLength: 1 }
        - name: provider
          in: query
          description: |
            Filter by model provider, such as `openai` or `azure`. Calls recorded
            without a provider appear as `unknown` and can be found with
            `provider=unknown`.

            Not restricted to a fixed list, so an unrecognised value returns no results
            rather than an error. The values below are the providers the platform can
            call. Cannot be empty (`400 INVALID_FILTER`).
          schema:
            {
              type: string,
              minLength: 1,
              x-common-values:
                [
                  openai,
                  anthropic,
                  azure,
                  bedrock,
                  microsoft_foundry,
                  google,
                  gemini,
                  vertex,
                  vertex_ai,
                  google_vertex,
                  cohere,
                  groq,
                  mistral,
                  fireworks,
                  togetherai,
                  together,
                  perplexity,
                  deepseek,
                  xai,
                  openrouter,
                  litellm,
                  openai_compatible,
                  ultravox,
                  custom,
                  mock,
                  unknown,
                ],
            }
        - name: environment
          in: query
          description: |
            Filter by environment. Note that this endpoint stores `development` rather
            than `dev` — unlike the sessions endpoint, which uses `dev`. Design-time
            calls, such as Studio test calls, are not tied to an environment and will
            not match this filter.

            Matched exactly as stored. Not restricted to a fixed list, so an
            unrecognised value returns no results rather than an error. Cannot be empty
            (`400 INVALID_FILTER`).
          schema: { type: string, enum: [development, staging, production, working-copy] }
        - name: name
          in: query
          description: Exact effective agent name, operation type, or provider fallback.
          schema: { type: string, minLength: 1 }
        - name: channelType
          in: query
          description: Exact transport-specific channel type.
          schema:
            {
              type: string,
              enum:
                [
                  http_async,
                  slack,
                  line,
                  msteams,
                  whatsapp,
                  messenger,
                  instagram,
                  twilio_sms,
                  zendesk,
                  telegram,
                  genesys,
                  genesys_open_messaging,
                  ai4w,
                  kore_agent_assist,
                  email,
                  voice_vxml,
                  korevg,
                  audiocodes,
                  genesys_audio_connector,
                  voice_pipeline,
                  voice_realtime,
                  voice,
                  voice_twilio,
                  voice_livekit,
                  ag_ui,
                  a2a,
                  sdk_websocket,
                  web_debug,
                  web_chat,
                  api,
                  http,
                ],
            }
        - name: attributionName
          in: query
          description: Display name of the credential, auth profile or other source the call is attributed to. Matched case-insensitively against the name after trimming. When the name matches more than one source, all of them are included and the response carries `attributionMatch`.
          schema: { type: string, minLength: 1 }
        - name: attributionType
          in: query
          description: Exact attribution type recorded on the call, for example `credential` or `auth_profile`.
          schema: { type: string, minLength: 1 }
        - name: attributionId
          in: query
          description: Exact attribution ID recorded on the call. Combine with `attributionType` to select one credential or auth profile.
          schema: { type: string, minLength: 1 }
        - name: attributionScope
          in: query
          description: Exact attribution scope recorded on the call.
          schema: { type: string, minLength: 1 }
        - name: dataMode
          in: query
          description: |
            How much detail to return per call. `summary` returns the facts about each
            call. `full` also includes the prompt sent and the response received, under
            `payload`, where these were stored.
          schema: { type: string, enum: [summary, full], default: summary }
        - name: sortBy
          in: query
          schema:
            { type: string, enum: [timestamp, latencyMs, cost, totalTokens], default: timestamp }
        - name: sortOrder
          in: query
          schema: { type: string, enum: [asc, desc], default: asc }
      responses:
        '200':
          description: LLM ledger page returned successfully.
          headers:
            Cache-Control: { schema: { type: string }, example: 'private, no-store, max-age=0' }
            X-ABL-Encrypted: { $ref: '#/components/headers/XAblEncrypted' }
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/LlmLedgerResponse'
                  - $ref: '#/components/schemas/EncryptedResponse'
              examples:
                summary:
                  summary: Summary mode
                  value:
                    success: true
                    statusCode: 200
                    total: 1
                    limit: 100
                    offset: 0
                    dataMode: summary
                    hasMore: false
                    generations:
                      - id: 'sess-1:call-1:2026-08-04T09:59:36.316Z:GPT-5.2:azure:1396:780:11659:0'
                        model: GPT-5.2
                        agentName: Support Agent
                        provider: azure
                        environment: production
                        status: success
                        inputTokens: 1396
                        cachedTokens: 224
                        completionTokens: 500
                        reasoningTokens: 280
                        outputTokens: 780
                        totalTokens: 2176
                        latencyMs: 11659
                        timeToFirstTokenMs: 0
                        streamingUsed: false
                        cost: 0.42
                        timestamp: '2026-08-04T09:59:36.316Z'
                        sessionId: sess-1
                        callId: call-1
                        traceId: trace-1
                        eventId: event-1
                        source: runtime
                        sourceSubtype: response_generation
                        sourceLabel: Runtime
                        sourceSubtypeLabel: Response Generation
                        sourceId: agent-1
                        channel: web_chat
                        channelType: web_chat
                        statusCode: 200
                        payloadState: available
                full:
                  summary: Full mode with inline request and response
                  value:
                    success: true
                    statusCode: 200
                    total: 1
                    limit: 100
                    offset: 0
                    dataMode: full
                    hasMore: false
                    generations:
                      - id: 'sess-1:call-1:2026-08-04T09:59:36.316Z:GPT-5.2:azure:1396:780:11659:0'
                        model: GPT-5.2
                        agentName: Support Agent
                        provider: azure
                        environment: production
                        status: success
                        inputTokens: 1396
                        cachedTokens: 224
                        completionTokens: 500
                        reasoningTokens: 280
                        outputTokens: 780
                        totalTokens: 2176
                        latencyMs: 11659
                        timeToFirstTokenMs: 0
                        streamingUsed: false
                        cost: 0.42
                        timestamp: '2026-08-04T09:59:36.316Z'
                        sessionId: sess-1
                        callId: call-1
                        traceId: trace-1
                        eventId: event-1
                        source: runtime
                        sourceSubtype: response_generation
                        sourceLabel: Runtime
                        sourceSubtypeLabel: Response Generation
                        sourceId: agent-1
                        channel: web_chat
                        channelType: web_chat
                        statusCode: 200
                        payloadState: available
                        payload:
                          request:
                            model: GPT-5.2
                            messages: [{ role: user, content: Hello }]
                          response:
                            text: 'How can I help?'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/ResponseTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
    post:
      tags:
        - LLM Ledger
      operationId: queryPublicLlmLedger
      summary: List LLM calls (parameters in the body)
      description: |
        POST form of `GET` on this path. It accepts the same parameters as a flat JSON
        body (`LlmLedgerQueryBody`) instead of a query string, and returns the same response.
        Use it when the request parameters must be encrypted. See "Sending parameters
        in a POST body" and "Payload encryption" in the API description.

        - Request encryption off: send `LlmLedgerQueryBody` as `application/json`.
        - Request encryption on: send the same object encrypted as an
          `EncryptedRequest`, preferably as `application/jose+json`.
        - Response encryption on: every response except `401` is an
          `EncryptedResponse` with `X-ABL-Encrypted: true`.
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/LlmLedgerQueryBody'
                - $ref: '#/components/schemas/EncryptedRequest'
            examples:
              plain:
                summary: Request encryption off
                value:
                  fromDate: '2026-08-01T00:00:00.000Z'
                  toDate: '2026-08-02T00:00:00.000Z'
                  status: failed
                  dataMode: summary
                  sortBy: timestamp
                  sortOrder: desc
                  limit: 50
                  offset: 0
              encrypted:
                summary: Request encryption on (JWE of the plain example)
                value: &id001
                  protected: eyJhbGciOiJkaXIiLCJlbmMiOiJBMjU2R0NNIiwia2lkIjoiNjZmN2ExYzJlNGIwYTFkMmMzZTRmNWE2In0
                  iv: oYYPW_6RxEsDR9Kq
                  ciphertext: 7Yqu-hzMpfFW7Ctc5gZiWoQvFrECfKqUbqa33wD6jBLX44QIegBlXvvYgJ2-jG8T_TP4gafy7QVk0FdsnMA0LWbhVrWEjDGiLBjgEhQB9kyFC4a__pBIXPbwJPbkDpmj2qIZw8LhfurVRK6Kmbnv1R4-FPT3aqfCamh4Ix3CC9Z4kPvio-TqQB3zsxjJZHjsBnRZn6nzWkJs4HR3ZGUsZ8DIysUwCSbsoV50ESqtxvVPvOBegxGij1aUriiVg04
                  tag: t1lAlMHFcbjNBYISc98GrQ
          application/jose+json:
            schema:
              $ref: '#/components/schemas/EncryptedRequest'
            example: *id001
      responses:
        '200':
          description: LLM ledger page returned successfully (same body as the GET form).
          headers:
            Cache-Control:
              schema:
                type: string
              example: private, no-store, max-age=0
            X-ABL-Encrypted:
              $ref: '#/components/headers/XAblEncrypted'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/LlmLedgerResponse'
                  - $ref: '#/components/schemas/EncryptedResponse'
              examples:
                encrypted:
                  summary: Response for a key with response encryption on (decrypt to get the
                    plain body)
                  value:
                    protected: eyJhbGciOiJSU0EtT0FFUC0yNTYiLCJlbmMiOiJBMjU2R0NNIiwia2lkIjoiNjZmN2ExYzJlNGIwYTFkMmMzZTRmNWE2IiwicGtmIjoiYTk1YWRiNGE2NTAwOTdmMzk1YTcyZDE0M2M4OGFjZmYxZDdmNzE3OTlkYzZmNDFiNjhiZDU5YmQzMGI1Mjc0MiJ9
                    encrypted_key: CYZa0douXIvcxdFpLN93tTs84XAkpHSBv9cCmiIoL7NgSdIhH3zn31vC0pnzWSKzIlZzrAPOQSRj7DNYY1wUM7q66HqYLeB0Z4fQaJ-WRpTNoP4i7rO-EB4lSQTMo8hm0gPFIY1QuiMv5QBVqqYMpyE32keFnj_JjC3YIN9QwyvyDScEbJ6nCqG9etkkpS_yHBRDP7vgtzBWT0MEuE2Xotu4fLV7WHDtNrS5FjpTE6FdaRPHnqs4mFtrmJaGWZzBdp5ssIffrS8OzXPo-eAW9NIZzzY3LnrNm0LeC5Rke9SBRh-EhP7ggHv_GlhM13v8d-qfFjeD15CIRZTU5UmnIA
                    iv: N2dEX08LzFPtTZiA
                    ciphertext: nZsJoUJj3bjdddpTOa--ww
                    tag: OUVK4WI9pnx0vPxB5dxZNg
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/ResponseTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: Project-bound API key. Do not send an Authorization header.
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
  headers:
    XAblEncrypted:
      description: Present with value `true` when the body is an `EncryptedResponse`. Absent
        otherwise.
      schema:
        type: string
        enum:
          - 'true'
  schemas:
    LlmLedgerResponse:
      type: object
      additionalProperties: false
      required: [success, statusCode, total, limit, offset, dataMode, hasMore, generations]
      properties:
        success:
          type: boolean
          const: true
          description: |
            Always true on a successful response.
        statusCode:
          type: integer
          const: 200
          description: |
            HTTP status code returned by the provider — 200 when the call succeeded.
        total:
          type: integer
          minimum: 0
          description: |
            Total number of calls matching your filters, across all pages.
        limit:
          type: integer
          minimum: 1
          maximum: 10000
          description: |
            The page size applied to this response.
        offset:
          type: integer
          minimum: 0
          description: |
            The offset applied to this response.
        dataMode:
          type: string
          enum: [summary, full]
          description: |
            The detail level applied to this response, echoing your request.
        hasMore:
          type: boolean
          description: |
            Whether more pages are available after this one.
        generations:
          type: array
          items: { $ref: '#/components/schemas/LlmGeneration' }
          description: |
            The LLM calls on this page.
        attributionMatch:
          type: object
          additionalProperties: false
          required: [name, sourceCount]
          description: |
            Present only when an `attributionName` filter matched more than one source.
          properties:
            name: { type: string, description: The name that was matched. }
            sourceCount:
              { type: integer, minimum: 2, description: How many sources share that name. }
    LlmGeneration:
      type: object
      additionalProperties: false
      required:
        [
          id,
          model,
          agentName,
          provider,
          environment,
          status,
          inputTokens,
          cachedTokens,
          completionTokens,
          reasoningTokens,
          outputTokens,
          totalTokens,
          latencyMs,
          timeToFirstTokenMs,
          streamingUsed,
          cost,
          timestamp,
          sessionId,
          callId,
          traceId,
          eventId,
          source,
          sourceSubtype,
          sourceLabel,
          sourceSubtypeLabel,
          sourceId,
          channel,
          channelType,
          attributionType,
          attributionId,
          attributionScope,
          attributionName,
          attributionProvider,
          statusCode,
          payloadState,
        ]
      properties:
        id: { type: string, description: Stable composite identifier derived from call attributes. }
        model:
          type: string
          description: |
            The model used, as recorded — for example `gpt-4o`. There is no fixed list,
            since each tenant can register its own models. `unknown` when no model was
            recorded.
          minLength: 1
        agentName:
          { type: string, description: Agent name, falling back to operation type or provider. }
        provider:
          type: string
          description: |
            The model provider, such as `openai` or `azure`. `unknown` when no provider
            was recorded. The values below are the providers the platform can call, but
            this is not a fixed list.
