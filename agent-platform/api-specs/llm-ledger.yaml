    EncryptedRequest:
      type: object
      additionalProperties: false
      required:
        - protected
        - iv
        - ciphertext
        - tag
      description: |
        Request body for a Platform Key with request encryption on: a JWE in flattened
        JSON serialization (RFC 7516 §7.2.2). The plaintext is the JSON body documented
        for the plain POST form. Send with `Content-Type: application/jose+json` or
        `application/json`.
      properties:
        protected:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
          description: |
            base64url of the protected header JSON. Decodes to `RequestProtectedHeader`.
            Its ASCII is also the AES-GCM additional authenticated data.
        encrypted_key:
          type: string
          maxLength: 0
          description: 'Empty or omitted: `dir` has no wrapped key.'
        iv:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
          description: base64url of a fresh random 12-byte AES-GCM IV.
        ciphertext:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
          description: base64url of the AES-256-GCM ciphertext.
        tag:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
          description: base64url of the 16-byte AES-GCM authentication tag.
    RequestProtectedHeader:
      type: object
      additionalProperties: false
      required:
        - alg
        - enc
      description: Decoded contents of `EncryptedRequest.protected`. Not sent as JSON on its own.
      properties:
        alg:
          type: string
          const: dir
        enc:
          type: string
          const: A256GCM
        kid:
          type: string
          description: Optional. If present, must equal the Platform Key's Key ID shown in Studio.
        typ:
          type: string
        cty:
          type: string
    EncryptedResponse:
      type: object
      additionalProperties: false
      required:
        - protected
        - encrypted_key
        - iv
        - ciphertext
        - tag
      description: |
        Response body for a Platform Key with response encryption on (signalled by the
        `X-ABL-Encrypted: true` header): a JWE in flattened JSON serialization. The
        decrypted plaintext is the JSON body documented for that status code.
      properties:
        protected:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
          description: base64url of the protected header. Decodes to `ResponseProtectedHeader`.
        encrypted_key:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
          description: The per-response AES-256 key, wrapped with the customer's RSA public key
            using RSA-OAEP-256.
        iv:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
          description: base64url of the 12-byte AES-GCM IV (fresh per response).
        ciphertext:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
          description: base64url of the AES-256-GCM ciphertext.
        tag:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
          description: base64url of the 16-byte AES-GCM authentication tag.
    ResponseProtectedHeader:
      type: object
      additionalProperties: false
      required:
        - alg
        - enc
        - kid
        - pkf
      description: Decoded contents of `EncryptedResponse.protected`. Not sent as JSON on its
        own.
      properties:
        alg:
          type: string
          const: RSA-OAEP-256
        enc:
          type: string
          const: A256GCM
        kid:
          type: string
          description: The Platform Key's Key ID.
        pkf:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: |
            Private header parameter: SHA-256 hex digest of the RSA public key's
            SubjectPublicKeyInfo DER bytes (not an RFC 7638 thumbprint). Use it to pick the
            matching private key during rotation.
  responses:
    BadRequest:
      description: |
        The request could not be understood. Common causes: `fromDate` or `toDate`
        missing or not a valid timestamp, `fromDate` not earlier than `toDate`, an
        unrecognised query parameter, an empty filter value, an invalid value for
        `status`, `dataMode`, `sortBy` or `sortOrder`, or a `limit` or `offset` outside
        the allowed range. The `error.code` says which.

        Encryption and POST-body errors also return 400: `ENCRYPTED_PAYLOAD_INVALID`
        (malformed, unexpected or undecryptable JWE, or a plain body for a
        request-encrypted key), `INVALID_REQUEST_BODY` (POST body is not a JSON object),
        and `INVALID_QUERY_PARAMETER` (unknown, null or nested POST body key, or a query
        string on a POST).
      content:
        {
          application/json:
            {
              schema:
                {
                  oneOf:
                    [
                      { $ref: '#/components/schemas/ErrorEnvelope' },
                      { $ref: '#/components/schemas/EncryptedResponse' },
                    ],
                },
            },
        }
    Unauthorized:
      description: Missing or invalid `x-api-key`, or Authorization was supplied.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Forbidden:
      description: The key lacks `analytics:read`.
      content:
        {
          application/json:
            {
              schema:
                {
                  oneOf:
                    [
                      { $ref: '#/components/schemas/ErrorEnvelope' },
                      { $ref: '#/components/schemas/EncryptedResponse' },
                    ],
                },
            },
        }
    NotFound:
      description: Project not found or concealed because it is outside the key's scope.
      content:
        {
          application/json:
            {
              schema:
                {
                  oneOf:
                    [
                      { $ref: '#/components/schemas/ErrorEnvelope' },
                      { $ref: '#/components/schemas/EncryptedResponse' },
                    ],
                },
            },
        }
    ResponseTooLarge:
      description: One full-mode generation exceeds the 1 MiB response budget.
      content:
        {
          application/json:
            {
              schema:
                {
                  oneOf:
                    [
                      { $ref: '#/components/schemas/ErrorEnvelope' },
                      { $ref: '#/components/schemas/EncryptedResponse' },
                    ],
                },
            },
        }
    RateLimited:
      description: Tenant request rate limit exceeded.
      content:
        {
          application/json:
            {
              schema:
                {
                  oneOf:
                    [
                      { $ref: '#/components/schemas/ErrorEnvelope' },
                      { $ref: '#/components/schemas/EncryptedResponse' },
                    ],
                },
            },
        }
    InternalError:
      description: |
        Unexpected LLM ledger query failure.

        Also returned, with a content-free body, when a response cannot be encrypted for
        a response-encrypted key.
      content:
        {
          application/json:
            {
              schema:
                {
                  oneOf:
                    [
                      { $ref: '#/components/schemas/ErrorEnvelope' },
                      { $ref: '#/components/schemas/EncryptedResponse' },
                    ],
                },
            },
        }
    Unavailable:
      description: |
        LLM ledger backing store unavailable.

        `ENCRYPTION_CONFIG_UNAVAILABLE` (with `Retry-After: 30`) means the Platform
        Key's payload-encryption configuration could not be read. There is no plaintext
        fallback.
      content:
        {
          application/json:
            {
              schema:
                {
                  oneOf:
                    [
                      { $ref: '#/components/schemas/ErrorEnvelope' },
                      { $ref: '#/components/schemas/EncryptedResponse' },
                    ],
                },
            },
        }
    UnsupportedMediaType:
      description: A POST body was sent with a `Content-Type` other than `application/json` or
        `application/jose+json` (`UNSUPPORTED_MEDIA_TYPE`).
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - $ref: '#/components/schemas/EncryptedResponse'
