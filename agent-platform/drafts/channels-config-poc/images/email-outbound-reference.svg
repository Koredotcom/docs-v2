<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc">
  <title id="title">Email outbound transport configuration</title>
  <desc id="desc">A sanitized Studio configuration reference comparing platform SMTP relay with Microsoft Graph API fields and optional email template settings.</desc>
  <rect width="1120" height="680" rx="28" fill="#f7f8fa"/>
  <rect x="28" y="28" width="1064" height="624" rx="22" fill="#fff" stroke="#d7dce5" stroke-width="2"/>
  <text x="62" y="78" fill="#111827" font-family="Arial,sans-serif" font-size="24" font-weight="700">Configuration → Outbound Transport</text>
  <rect x="58" y="112" width="482" height="222" rx="16" fill="#eef2ff" stroke="#a5b4fc" stroke-width="2"/>
  <text x="82" y="151" fill="#3730a3" font-family="Arial,sans-serif" font-size="20" font-weight="700">SMTP (Default)</text>
  <text x="82" y="190" fill="#4b5563" font-family="Arial,sans-serif" font-size="17">Uses the platform-managed relay</text>
  <text x="82" y="225" fill="#4b5563" font-family="Arial,sans-serif" font-size="17">No per-connection credentials</text>
  <text x="82" y="260" fill="#4b5563" font-family="Arial,sans-serif" font-size="17">Ask the platform administrator to validate</text>
  <text x="82" y="290" fill="#4b5563" font-family="Arial,sans-serif" font-size="17">relay host, sender policy, and deliverability</text>
  <rect x="580" y="112" width="482" height="222" rx="16" fill="#ecfeff" stroke="#67e8f9" stroke-width="2"/>
  <text x="604" y="151" fill="#155e75" font-family="Arial,sans-serif" font-size="20" font-weight="700">Microsoft Graph API</text>
  <text x="604" y="190" fill="#164e63" font-family="Arial,sans-serif" font-size="17">Azure AD Tenant ID</text>
  <text x="604" y="225" fill="#164e63" font-family="Arial,sans-serif" font-size="17">Application (Client) ID</text>
  <text x="604" y="260" fill="#164e63" font-family="Arial,sans-serif" font-size="17">Sender Mailbox Address</text>
  <text x="604" y="295" fill="#164e63" font-family="Arial,sans-serif" font-size="17">Client Secret (encrypted credential)</text>
  <rect x="58" y="374" width="1004" height="162" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="82" y="414" fill="#111827" font-family="Arial,sans-serif" font-size="20" font-weight="700">Optional email experience</text>
  <rect x="82" y="444" width="274" height="52" rx="10" fill="#fff" stroke="#cbd5e1"/><text x="106" y="476" fill="#475569" font-family="Arial,sans-serif" font-size="17">Header HTML</text>
  <rect x="382" y="444" width="274" height="52" rx="10" fill="#fff" stroke="#cbd5e1"/><text x="406" y="476" fill="#475569" font-family="Arial,sans-serif" font-size="17">Footer HTML</text>
  <rect x="682" y="444" width="356" height="52" rx="10" fill="#dcfce7" stroke="#86efac"/><text x="706" y="476" fill="#166534" font-family="Arial,sans-serif" font-size="17">✓ Include CSAT rating</text>
  <rect x="58" y="570" width="1004" height="48" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="82" y="601" fill="#9a3412" font-family="Arial,sans-serif" font-size="17">Save configuration, then send a real threaded reply before production rollout.</text>
</svg>
