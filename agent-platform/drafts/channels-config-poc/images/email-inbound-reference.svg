<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc">
  <title id="title">Email inbound connection and routing</title>
  <desc id="desc">A sanitized reference showing Studio generating an inbound address and a customer mailbox routing SMTP mail to it while preserving thread headers.</desc>
  <rect width="1120" height="680" rx="28" fill="#f7f8fa"/>
  <rect x="28" y="28" width="1064" height="624" rx="22" fill="#fff" stroke="#d7dce5" stroke-width="2"/>
  <circle cx="60" cy="60" r="8" fill="#f87171"/><circle cx="84" cy="60" r="8" fill="#fbbf24"/><circle cx="108" cy="60" r="8" fill="#4ade80"/>
  <text x="148" y="68" fill="#1f2937" font-family="Arial,sans-serif" font-size="22" font-weight="700">Email connection</text>
  <rect x="58" y="108" width="1004" height="100" rx="14" fill="#eef2ff" stroke="#a5b4fc" stroke-width="2"/>
  <text x="82" y="143" fill="#3730a3" font-family="Arial,sans-serif" font-size="17" font-weight="700">STUDIO-GENERATED INBOUND ADDRESS</text>
  <text x="82" y="180" fill="#111827" font-family="monospace" font-size="22">8f34c2a1@inbound.example.com</text>
  <rect x="58" y="252" width="330" height="152" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="82" y="292" fill="#111827" font-family="Arial,sans-serif" font-size="20" font-weight="700">Customer mailbox</text>
  <text x="82" y="329" fill="#475569" font-family="Arial,sans-serif" font-size="17">support@example.com</text>
  <text x="82" y="365" fill="#475569" font-family="Arial,sans-serif" font-size="16">Forward or route inbound mail</text>
  <path d="M410 326h116" stroke="#6366f1" stroke-width="8" stroke-linecap="round"/>
  <path d="M505 300l34 26-34 26" fill="none" stroke="#6366f1" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="566" y="252" width="496" height="152" rx="16" fill="#ecfeff" stroke="#67e8f9" stroke-width="2"/>
  <text x="590" y="292" fill="#155e75" font-family="Arial,sans-serif" font-size="20" font-weight="700">Platform SMTP ingress</text>
  <text x="590" y="329" fill="#164e63" font-family="Arial,sans-serif" font-size="17">Resolves the Active connection by recipient</text>
  <text x="590" y="365" fill="#164e63" font-family="Arial,sans-serif" font-size="16">Parses body, thread headers, CC, and attachments</text>
  <rect x="58" y="446" width="1004" height="170" rx="14" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="82" y="483" fill="#166534" font-family="Arial,sans-serif" font-size="19" font-weight="700">Preserve RFC 5322 thread identity</text>
  <rect x="82" y="510" width="196" height="48" rx="24" fill="#dcfce7"/><text x="111" y="541" fill="#166534" font-family="monospace" font-size="17">Message-ID</text>
  <rect x="296" y="510" width="196" height="48" rx="24" fill="#dcfce7"/><text x="322" y="541" fill="#166534" font-family="monospace" font-size="17">In-Reply-To</text>
  <rect x="510" y="510" width="196" height="48" rx="24" fill="#dcfce7"/><text x="539" y="541" fill="#166534" font-family="monospace" font-size="17">References</text>
  <text x="82" y="594" fill="#166534" font-family="Arial,sans-serif" font-size="16">Replies reuse the existing conversation; unrelated messages start separate sessions.</text>
</svg>
